<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { width: 1280px; height: 800px; padding: 0 90px; display: flex; flex-direction: column; justify-content: center; }
h1 { font-size: 42px; margin: 0 0 14px; }
.sub { font-size: 22px; color: #495057; margin: 0 0 56px; }
.cols { display: flex; gap: 28px; align-items: stretch; }
.card { flex: 1; white-space: nowrap; background: #fff; border-radius: 14px; padding: 40px 40px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
.card h2 { font-size: 26px; margin: 0 0 30px; color: #495057; }
.card.after { border: 3px solid #1971c2; }
.card.after h2 { color: #1971c2; }
.line { display: flex; align-items: center; gap: 14px; font-size: 24px; margin-bottom: 22px; } .line .act { width: 80px; }
.line .who { width: 100px; color: #868e96; }
.arrow { align-self: center; font-size: 54px; color: #1971c2; }
.dbg { color: #c92a2a; font-weight: bold; }
.ok { color: #1971c2; font-weight: bold; }
</style></head>
<body>
<h1>어느 버전에서든 같은 손 감각</h1>
<p class="sub">솔루션 버전마다 F8·F9 배치가 달라 헷갈리던 문제를 브라우저에서 해결합니다.</p>
<div class="cols">
    <div class="card">
        <h2>설치 전</h2>
        <div class="line"><span class="who">버전 A</span><span class="key">F8</span><span class="act"><b class="dbg">디버그</b></span><span class="key">F9</span><span class="act">테스트</span></div>
        <div class="line"><span class="who">버전 B</span><span class="key">F8</span><span class="act">조회</span><span class="key">F9</span><span class="act"><b class="dbg">디버그</b></span></div>
    </div>
    <div class="arrow">→</div>
    <div class="card after">
        <h2>설치 후 (내 디버그 키 = F8)</h2>
        <div class="line"><span class="who">버전 A</span><span class="key">F8</span><span class="act"><b class="ok">디버그</b></span><span class="key">F9</span><span class="act">테스트</span></div>
        <div class="line"><span class="who">버전 B</span><span class="key">F8</span><span class="act"><b class="ok">디버그</b></span><span class="key">F9</span><span class="act">조회</span></div>
    </div>
</div>
</body></html>
