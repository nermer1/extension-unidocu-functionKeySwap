<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <style>
        body { width: 300px; margin: 0; padding: 12px; font: 13px/1.5 'Malgun Gothic', sans-serif; color: #212529; }
        h1 { font-size: 14px; margin: 0 0 8px; }
        .pref { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #f1f3f5; border-radius: 4px; margin-bottom: 10px; }
        .pref select { margin-left: auto; }
        .site { color: #495057; word-break: break-all; margin-bottom: 6px; }
        label.toggle { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer; }
        .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        select, input[type=text] { padding: 3px 6px; border: 1px solid #ced4da; border-radius: 4px; font: inherit; }
        input[type=text] { flex: 1; }
        button { padding: 4px 10px; border: 1px solid #1971c2; background: #1971c2; color: #fff; border-radius: 4px; cursor: pointer; font: inherit; }
        button:disabled { opacity: .5; cursor: default; }
        .status { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #e7f5ff; color: #1864ab; margin-bottom: 6px; }
        .status.none { background: #fff9db; color: #8a6d00; }
        .hint { color: #868e96; font-size: 12px; }
        .msg { color: #2b8a3e; font-size: 12px; margin-top: 6px; min-height: 16px; }
        .err { color: #c92a2a; }
        .hidden { display: none; }
        h2 { font-size: 12px; color: #495057; margin: 10px 0 4px; padding-top: 8px; border-top: 1px solid #e9ecef; }
        ul { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow: auto; }
        li { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #f1f3f5; }
        li .o { flex: 1; min-width: 0; word-break: break-all; }
        li .o.cur { font-weight: bold; color: #1971c2; }
        li .m { color: #868e96; font-size: 11px; white-space: nowrap; }
        li button { padding: 1px 6px; font-size: 11px; background: #fff; color: #c92a2a; border-color: #ffc9c9; }
        .empty { color: #adb5bd; font-size: 12px; }
    </style>
</head>
<body>
    <h1>functionKeyCompat</h1>
    <div class="pref">내 디버그 키
        <select id="pref"><option value="F8">F8</option><option value="F9">F9</option></select>
    </div>

    <div class="site" id="site">현재 사이트 확인 중…</div>
    <label class="toggle"><input type="checkbox" id="enabled"> 이 사이트에서 사용</label>
    <div id="siteOpts" class="hidden">
        <div class="row">
            <select id="mode">
                <option value="auto">자동 감지 (추천)</option>
                <option value="custom">직접 지정</option>
            </select>
        </div>
        <div class="status" id="status"></div>
        <div id="customRow" class="hidden">
            <div class="row">
                <input type="text" id="map" placeholder="F8=F9, F9=F8">
                <button id="save">저장</button>
            </div>
            <div class="hint">형식: 누른 키=실행할 키 (쉼표로 구분)</div>
        </div>
    </div>
    <div class="msg" id="msg"></div>

    <h2>사용 중인 사이트</h2>
    <ul id="list"></ul>
    <script src="popup.js"></script>
</body>
</html>
